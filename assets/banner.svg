      <animate attributeName="fill-opacity" values=".06;.26;.26;.06;.06" keyTimes="0;.015;.128;.143;1" begin="8s" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".3;1;1;.3;.3" keyTimes="0;.015;.128;.143;1" begin="8s" dur="14s" repeatCount="indefinite"/>
