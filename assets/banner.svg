    <text x="784.5" y="340" font-size="20" text-anchor="middle" fill="#cfe9dc">wechat_inspector<animate attributeName="fill" values="#cfe9dc;#ffffff;#ffffff;#cfe9dc;#cfe9dc" keyTimes="0;.015;.128;.143;1" begin="6s" dur="14s" repeatCount="indefinite"/></text>
  </g>
