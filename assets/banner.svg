    <text x="946" y="352" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#e9f3ee">运行时日志采集</text>
    <text x="946" y="384" font-size="15" fill="#3fe08d">console · cdp</text>
