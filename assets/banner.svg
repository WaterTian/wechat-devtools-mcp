      <animate attributeName="stroke-opacity" values=".3;1;1;.3;.3" keyTimes="0;.015;.128;.143;1" begin="10s" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="434.5" y="394" font-size="20" text-anchor="middle" fill="#cfe9dc">wechat_navigate<animate attributeName="fill" values="#cfe9dc;#ffffff;#ffffff;#cfe9dc;#cfe9dc" keyTimes="0;.015;.128;.143;1" begin="10s" dur="14s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <rect x="554" y="366" width="166" height="42" rx="10" fill="#07c160" fill-opacity=".06" stroke="#3fe08d" stroke-opacity=".3">
      <animate attributeName="fill-opacity" values=".06;.26;.26;.06;.06" keyTimes="0;.015;.128;.143;1" begin="12s" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".3;1;1;.3;.3" keyTimes="0;.015;.128;.143;1" begin="12s" dur="14s" repeatCount="indefinite"/>
    </rect>
