  <!-- 模式 4：当前工具的说明，通过 opacity 叠加切换 -->
  <rect x="922" y="312" width="282" height="96" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.015;.128;.143;1" begin="0s" dur="14s" repeatCount="indefinite"/>
    <text x="946" y="352" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#e9f3ee">IDE 生命周期与环境诊断</text>
