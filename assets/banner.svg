  <line x1="76" y1="436" x2="1204" y2="436" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="76" y="477" font-size="21" fill="#3fe08d">$</text>
  <text x="102" y="477" font-size="21" fill="#e9f3ee" clip-path="url(#typed)">uv tool install wechat-devtools-mcp</text>
  <text x="1204" y="477" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" text-anchor="end" fill="#9db3a8">Windows / macOS · Official MCP Registry</text>
