<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <title>wechat-devtools-mcp — MCP Server + Skill for WeChat DevTools</title>
  <desc>Animated banner, pure SMIL (no JS / CSS). The seven tools light up in turn, 2s each, with a matching description.</desc>

  <defs>
    <radialGradient id="glowA" gradientUnits="userSpaceOnUse" cx="1280" cy="0" r="720">
      <stop offset="0" stop-color="#07c160" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07c160" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" gradientUnits="userSpaceOnUse" cx="0" cy="520" r="560">
      <stop offset="0" stop-color="#07c160" stop-opacity=".16"/>
      <stop offset="1" stop-color="#07c160" stop-opacity="0"/>
    </radialGradient>
    <!-- 模式 3：clip-path 揭示，安装命令逐步「敲」出来 -->
    <clipPath id="typed">
      <rect x="96" y="452" width="0" height="36">
        <animate attributeName="width" values="0;0;560;560;0" keyTimes="0;.02;.14;.985;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1280" height="520" rx="24" fill="#0a1110"/>
  <rect width="1280" height="520" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="520" rx="24" fill="url(#glowB)"/>

  <!-- 模式 8：每个工具时段开头心跳一次 -->
  <circle cx="82" cy="70" r="6" fill="#07c160"/>
  <circle cx="82" cy="70" r="6" fill="none" stroke="#3fe08d" stroke-width="2" opacity="0">
    <animate attributeName="r" values="6;16;16" keyTimes="0;.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0;0" keyTimes="0;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="78" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" letter-spacing=".9" fill="#3fe08d">MCP SERVER + SKILL · 微信开发者工具</text>

  <!-- 模式 6（颜色变换）+ 模式 7（离散闪烁光标） -->
  <text x="76" y="170" font-size="80" font-weight="700" letter-spacing="-2.8" fill="#e9f3ee">wechat-devtools<tspan fill="#07c160">-mcp<animate attributeName="fill" values="#07c160;#6af2ad;#07c160" dur="4s" repeatCount="indefinite"/></tspan><tspan dx="18" fill="#e9f3ee">▎<animate attributeName="fill-opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="1.06s" repeatCount="indefinite"/></tspan></text>

  <text x="76" y="234" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="600" fill="#e9f3ee">让编辑器里的 AI 直接编译、预览、调试、自动化测试小程序</text>
  <text x="76" y="272" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#9db3a8">Compile, preview, debug and auto-test WeChat Mini Programs from your AI editor</text>

