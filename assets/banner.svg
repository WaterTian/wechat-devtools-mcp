      <animate attributeName="stroke-opacity" values=".3;1;1;.3;.3" keyTimes="0;.015;.128;.143;1" begin="0s" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="153" y="340" font-size="20" text-anchor="middle" fill="#cfe9dc">wechat_ide<animate attributeName="fill" values="#cfe9dc;#ffffff;#ffffff;#cfe9dc;#cfe9dc" keyTimes="0;.015;.128;.143;1" begin="0s" dur="14s" repeatCount="indefinite"/></text>
  </g>
