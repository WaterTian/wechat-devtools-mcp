  </g>
  <g>
    <rect x="671" y="312" width="227" height="42" rx="10" fill="#07c160" fill-opacity=".06" stroke="#3fe08d" stroke-opacity=".3">
      <animate attributeName="fill-opacity" values=".06;.26;.26;.06;.06" keyTimes="0;.015;.128;.143;1" begin="6s" dur="14s" repeatCount="indefinite"/>
