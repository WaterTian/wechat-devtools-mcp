    <text x="946" y="352" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#e9f3ee">长图拼接截图</text>
    <text x="946" y="384" font-size="15" fill="#3fe08d">full_page · scroll_top</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.015;.128;.143;1" begin="10s" dur="14s" repeatCount="indefinite"/>
    <text x="946" y="352" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#e9f3ee">跳转并采集 CDP 日志</text>
