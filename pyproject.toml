[project]
name = "wechat-devtools-mcp"
version = "0.9.17"
description = "MCP Server for WeChat DevTools CLI - 微信开发者工具 MCP 服务"
readme = "README.md"
authors = [
    { name = "WaterTian", email = "changewater@qq.com" }
]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.9,<3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
screenshot = ["pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/WaterTian/wechat-devtools-mcp"
Repository = "https://github.com/WaterTian/wechat-devtools-mcp.git"
Issues = "https://github.com/WaterTian/wechat-devtools-mcp/issues"

[project.scripts]
wechat-devtools-mcp = "wechat_devtools_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_devtools_mcp"]
exclude = [
    "src/wechat_devtools_mcp/scripts/*.js",
    "src/wechat_devtools_mcp/scripts/*.json",
    "src/wechat_devtools_mcp/scripts/*.sh",
    "src/wechat_devtools_mcp/scripts/*.bat",
    "src/wechat_devtools_mcp/scripts/node_modules",
    "src/wechat_devtools_mcp/scripts/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"src/wechat_devtools_mcp/scripts/dist" = "wechat_devtools_mcp/scripts/dist"

[tool.hatch.build.targets.sdist]
include = [
    "/src/wechat_devtools_mcp",
    "/README.md",
    "LICENSE",
    "/src/wechat_devtools_mcp/scripts/dist/**",
]
exclude = [
    "src/wechat_devtools_mcp/scripts/*.js",
    "src/wechat_devtools_mcp/scripts/*.json",
    "src/wechat_devtools_mcp/scripts/*.sh",
    "src/wechat_devtools_mcp/scripts/*.bat",
    "src/wechat_devtools_mcp/scripts/node_modules",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
